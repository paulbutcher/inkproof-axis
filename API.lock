theorem Inkproof.Axis.Proofs.timeTickContextsAtWith_eq : ∀ (style : Inkproof.Axis.TimeStyle) (off : Int → Int) (months : List String) (step : Float) (ticks : List Float), Inkproof.Axis.timeTickContextsAtWith style off months step ticks = if (ticks.all fun t => t.isFinite && Decidable.decide (t.abs < 1e15) && step.isFinite && Decidable.decide (0 ≤ step) && Decidable.decide (step < 1e15)) = Bool.true then Inkproof.Axis.timeContextsAtWith style off months step.floor.toUInt64.toNat (List.map (fun t => t.floor.toInt64.toInt) ticks) else []
theorem Inkproof.Axis.Proofs.timeTickContextsAt_eq : ∀ (off : Int → Int) (months : List String) (step : Float) (ticks : List Float), Inkproof.Axis.timeTickContextsAt off months step ticks = if (ticks.all fun t => t.isFinite && Decidable.decide (t.abs < 1e15) && step.isFinite && Decidable.decide (0 ≤ step) && Decidable.decide (step < 1e15)) = Bool.true then Inkproof.Axis.timeContextsAt off months step.floor.toUInt64.toNat (List.map (fun t => t.floor.toInt64.toInt) ticks) else []
