theorem Inkproof.Axis.Proofs.thin_sublist : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : DecidableLE α] {β : Type v} (span : β → Inkproof.Axis.Span α) (gap : α) (items : List β), (Inkproof.Axis.thin span gap items).snd.Sublist items
theorem Inkproof.Axis.Proofs.timeContextWith_default : ∀ (months : List String) (step : Nat) (prev : Option Int) (t : Int), Inkproof.Axis.timeContextWith { } months step prev t = Inkproof.Axis.timeContext months step prev t
theorem Inkproof.Axis.Proofs.timeContextWith_short_example : Inkproof.Axis.timeContextWith { contextDate := Inkproof.Axis.DateStyle.numeric '/' Bool.false } [] 3600 Option.none 1594958400 = Option.some "7/17/20"
theorem Inkproof.Axis.Proofs.timeContext_clock : ∀ (months : List String) (step : Nat) (prev : Option Int) (t : Int) (h m : Nat) (s : Option Nat), Inkproof.Axis.timeLabel step t = Inkproof.Axis.TimeLabel.clock h m s → Inkproof.Axis.timeContext months step prev t = if Option.map (fun q => (Inkproof.Core.Calendar.civilFromDays (q / 86400)).snd) prev = Option.some (Inkproof.Core.Calendar.civilFromDays (t / 86400)).snd then Option.none else Option.some (String.ofList (Inkproof.Axis.TimeLabel.render months (Inkproof.Axis.TimeLabel.date (Inkproof.Core.Calendar.civilFromDays (t / 86400)).snd.fst (Inkproof.Core.Calendar.civilFromDays (t / 86400)).snd.snd)))
theorem Inkproof.Axis.Proofs.timeContext_year : ∀ (months : List String) (step : Nat) (prev : Option Int) (t : Int), (∀ (h m : Nat) (s : Option Nat), Inkproof.Axis.timeLabel step t ≠ Inkproof.Axis.TimeLabel.clock h m s) → Inkproof.Axis.timeContext months step prev t = if Option.map (fun q => (Inkproof.Core.Calendar.civilFromDays (q / 86400)).fst) prev = Option.some (Inkproof.Core.Calendar.civilFromDays (t / 86400)).fst then Option.none else Option.some (ToString.toString (Inkproof.Core.Calendar.civilFromDays (t / 86400)).fst)
theorem Inkproof.Axis.Proofs.timeContextsAtWith_eq : ∀ (style : Inkproof.Axis.TimeStyle) (off : Int → Int) (months : List String) (step : Nat) (ticks : List Int), Inkproof.Axis.timeContextsAtWith style off months step ticks = Inkproof.Axis.timeContextsWith style months step (List.map (fun t => t + off t) ticks)
theorem Inkproof.Axis.Proofs.timeContextsAt_eq : ∀ (off : Int → Int) (months : List String) (step : Nat) (ticks : List Int), Inkproof.Axis.timeContextsAt off months step ticks = Inkproof.Axis.timeContexts months step (List.map (fun t => t + off t) ticks)
theorem Inkproof.Axis.Proofs.timeContextsWith_default : ∀ (months : List String) (step : Nat) (ticks : List Int), Inkproof.Axis.timeContextsWith { } months step ticks = Inkproof.Axis.timeContexts months step ticks
theorem Inkproof.Axis.Proofs.timeContexts_eq : ∀ (months : List String) (step : Nat) (ticks : List Int), Inkproof.Axis.timeContexts months step ticks = List.map (fun x => match x with | (t, p) => Inkproof.Axis.timeContext months step p t) (ticks.zip (Option.none :: List.map Option.some ticks))
