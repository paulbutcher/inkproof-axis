theorem Inkproof.Axis.Proofs.thin_stride_le : ∀ {α : Type u} {β : Type v} [inst : Add α] [inst_1 : LE α] [inst_2 : DecidableLE α] (span : β → Inkproof.Axis.Span α) (gap : α) (items : List β) {t : Nat}, 1 ≤ t → Inkproof.Axis.clearChain span gap (Inkproof.Axis.everyNth t items) = Bool.true → (Inkproof.Axis.thin span gap items).fst ≤ t
