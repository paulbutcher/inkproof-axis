theorem Inkproof.Axis.Proofs.trimFraction_of_not_mem : ∀ (loc : Inkproof.Axis.Locale) (cs : List Char), ¬loc.decimal ∈ cs → Inkproof.Axis.trimFraction loc cs = cs
theorem Inkproof.Axis.Proofs.trimFraction_split : ∀ (loc : Inkproof.Axis.Locale) (whole frac : List Char), loc.decimal ≠ '0' → ¬loc.decimal ∈ frac → Inkproof.Axis.trimFraction loc (whole ++ loc.decimal :: frac) = whole ++ if (List.dropWhile (fun x => Decidable.decide (x = '0')) frac.reverse).isEmpty = Bool.true then [] else loc.decimal :: (List.dropWhile (fun x => Decidable.decide (x = '0')) frac.reverse).reverse
theorem Inkproof.Axis.Proofs.twoDigits_spec : ∀ {n : Nat}, n < 100 → Inkproof.Axis.twoDigits n = [(n / 10).digitChar, (n % 10).digitChar]
theorem Inkproof.Axis.Proofs.twoValue_spec : ∀ {a b : Nat}, a < 10 → b < 10 → Inkproof.Axis.twoValue a.digitChar b.digitChar = Option.some (10 * a + b)
theorem Inkproof.Axis.Proofs.ungroupWhole_spec : ∀ (loc : Inkproof.Axis.Locale) (l : List Char), Inkproof.Axis.ungroupWhole loc l = match loc.group with | Option.some g => List.filter (fun x => Decidable.decide (x ≠ g)) l | Option.none => l
theorem Inkproof.Axis.Proofs.ungroup_group : ∀ {loc : Inkproof.Axis.Locale}, loc.Valid → ∀ (l : List Char), (∀ (c : Char), c ∈ l → c.isDigit = Bool.true) → Inkproof.Axis.ungroupWhole loc (Inkproof.Axis.groupWhole loc l) = l
theorem Inkproof.Axis.Proofs.valid_map_range : ∀ {α : Type u} [inst : LE α] [inst_1 : LT α] [Std.LawfulOrderLT α] [Std.IsLinearOrder α] {lo hi : α} [inst_4 : DecidableLE α] [inst_5 : DecidableLT α] (f : Nat → α), (∀ (i j : Nat), i < j → f i < f j) → ∀ (n s : Nat), lo ≤ f s → (∀ (i : Nat), s ≤ i → i < s + n → f i ≤ hi) → Inkproof.Axis.Ticks.Valid lo hi (List.map f (List.range' s n)) = Bool.true
