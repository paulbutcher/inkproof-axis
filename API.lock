theorem Inkproof.Axis.Proofs.decadeTicks_valid : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] [inst_6 : DecidableLE α] [inst_7 : DecidableLT α] {fl : α → Int}, Inkproof.Axis.Proofs.IsFloor fl → ∀ {lg : α → α} {pw : Int → α} {lo hi : α} {stride : Nat}, 0 < stride → (∀ (a b : Int), a < b → pw a < pw b) → (∀ (e : Int), lg lo ≤ ↑e → lo ≤ pw e) → (∀ (e : Int), ↑e ≤ lg hi → pw e ≤ hi) → Inkproof.Axis.Ticks.Valid lo hi (Inkproof.Axis.decadeTicks fl lg pw lo hi stride) = Bool.true
