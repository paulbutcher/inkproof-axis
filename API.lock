theorem Inkproof.Axis.Proofs.transformTicks_eq : ∀ (fwd inv round : Float → Float) (lo hi a b u0 u1 : Float) (target : Nat), Inkproof.Axis.ordered lo hi = Option.some (a, b) → Inkproof.Axis.ordered (fwd a) (fwd b) = Option.some (u0, u1) → Inkproof.Axis.transformTicks fwd inv round lo hi target = Inkproof.Axis.mapBack (Decidable.decide (fwd a < fwd b)) round inv a b (Inkproof.Axis.gridTicks u0 u1 (Inkproof.Axis.niceStep (u1 - u0) target))
theorem Inkproof.Axis.Proofs.transformTicks_of_unordered : ∀ (fwd inv round : Float → Float) (lo hi : Float) (target : Nat), Inkproof.Axis.ordered lo hi = Option.none → Inkproof.Axis.transformTicks fwd inv round lo hi target = []
theorem Inkproof.Axis.Proofs.transformTicks_of_unspread : ∀ (fwd inv round : Float → Float) (lo hi a b : Float) (target : Nat), Inkproof.Axis.ordered lo hi = Option.some (a, b) → Inkproof.Axis.ordered (fwd a) (fwd b) = Option.none → Inkproof.Axis.transformTicks fwd inv round lo hi target = []
theorem Inkproof.Axis.Proofs.trimFraction_en_half : Inkproof.Axis.trimFraction Inkproof.Axis.Locale.en "0.50".toList = "0.5".toList
theorem Inkproof.Axis.Proofs.trimFraction_en_hundred : Inkproof.Axis.trimFraction Inkproof.Axis.Locale.en "100".toList = "100".toList
